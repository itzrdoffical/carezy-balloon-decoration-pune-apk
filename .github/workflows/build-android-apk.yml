
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check project files
        run: |
          echo "Project files:"
          ls -la
          echo "Searching for Android project:"
          find . -maxdepth 4 -name gradlew -o -name build.gradle

      - name: Stop if Android folder is missing
        run: |
          if [ ! -d "android" ]; then
            echo "ERROR: Android folder is missing."
            exit 1
          fi

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Carezy-Balloon-Decoration-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          
